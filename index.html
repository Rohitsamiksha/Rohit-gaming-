
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Gaming</title>
<style>
body {
  margin: 0;
  background: #101020;
  color: white;
  font-family: Arial;
  text-align: center;
}
header {
  background: #6425dc;
  padding: 25px;
}
h1 { margin: 5px; }
.games {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 20px;
}
.game {
  background: #252544;
  padding: 25px 10px;
  border-radius: 15px;
}
button {
  background: #8b4dff;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
}
#result { font-size: 22px; }
</style>
</head>
<body>

<header>
<h1>🎮 ROHIT GAMING</h1>
<p>Welcome to My Gaming World!</p>
</header>

<h2>🔥 Play Free Games</h2>

<div class="games">
<div class="game">
<h3>🎯 Click Game</h3>
<p>Score: <span id="score">0</span></p>
<button onclick="play()">PLAY</button>
</div>

<div class="game">
<h3>🎲 Number Guess</h3>
<p>Guess 1 to 5</p>
<input id="guess" type="number" min="1" max="5">
<br><br>
<button onclick="check()">CHECK</button>
<p id="result"></p>
</div>
</div>

<script>
let score = 0;

function play() {
  score++;
  document.getElementById("score").innerText = score;
}

function check() {
  let n = Math.floor(Math.random()*5)+1;
  let g = Number(document.getElementById("guess").value);
  document.getElementById("result").innerText =
    g === n ? "🎉 You Win!" : "Try Again! Number was " + n;
}
</script>

</body>
</html>
